[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indiaruns-atlas"
version = "0.1.0"
description = "IndiaRuns / ATLAS — Intelligent Candidate Discovery & Ranking (Track 1)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IndiaRuns" }]
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
precompute = [
    "sentence-transformers>=3.0",
    "xgboost>=2.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "huggingface-hub>=0.24",
    "httpx>=0.27",
    "requests>=2.32",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools]
py-modules = ["rank", "features", "reasoning", "validate_submission"]
packages = ["core", "precompute"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741", "E702"]

[tool.ruff.lint.per-file-ignores]
# rank.py and precompute scripts set sys.path before local imports by design.
"rank.py" = ["E402"]
"precompute/*.py" = ["E402"]
"data/*.py" = ["E402"]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
