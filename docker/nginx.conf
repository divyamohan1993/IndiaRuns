# OPTIONAL nginx reverse-proxy config: front the ATLAS web (Next.js Node server) and the
# API on a single origin so the browser uses same-origin /api (no CORS). Not required for
# Cloud Run (where web and api are separate services); useful for a single-host / VM deploy
# or local docker-compose. The web image itself runs a Node server (docker/Dockerfile.web);
# this file is only for an optional fronting proxy.
#
# Usage (example): mount over /etc/nginx/conf.d/default.conf in an nginx:1.27-alpine
# container with WEB_UPSTREAM=web:8080 and API_UPSTREAM=api:8080 reachable.
upstream atlas_web { server web:8080; }
upstream atlas_api { server api:8080; }

server {
    listen       8080;
    server_name  _;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"proxy"}';
    }

    # API on the same origin.
    location /api/ {
        proxy_pass         http://atlas_api;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Everything else -> the Next.js Node server.
    location / {
        proxy_pass         http://atlas_web;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
