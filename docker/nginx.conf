# OPTIONAL nginx reverse-proxy config: front the ATLAS web (Next.js Node server) on a single
# origin. The web app OWNS all of its own /api/* route handlers (sandbox, og, copilot,
# outreach, compare, intent, health), so every request — including /api/* — must reach the
# Next.js server. The standalone FastAPI service is optional/independent and is NOT fronted
# here; proxying /api/* to FastAPI would 404 the Next-only routes (/api/sandbox, /api/og) and
# return the wrong response shape for the rest. Not required for Cloud Run (web and api are
# separate services); useful for a single-host / VM deploy or local docker-compose. The web
# image itself runs a Node server (docker/Dockerfile.web); this file is only an optional
# fronting proxy.
#
# Usage (example): mount over /etc/nginx/conf.d/default.conf in an nginx:1.27-alpine
# container with WEB_UPSTREAM=web:8080 reachable.
upstream atlas_web { server web:8080; }

server {
    listen       8080;
    server_name  _;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"proxy"}';
    }

    # Everything (including /api/*, which the Next.js app owns) -> the Next.js Node server.
    location / {
        proxy_pass         http://atlas_web;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
