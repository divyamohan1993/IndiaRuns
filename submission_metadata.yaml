# ============================================================================
# AI tools declaration  (transparency only — declared use is NOT penalized)
# ============================================================================
ai_tools_used:
  - "Claude"                                   # architecture, code authoring/review, docs, deck, offline LLM judge (claude CLI)
  - "NVIDIA NIM / build.nvidia.com endpoints"  # offline embeddings + shortlist re-rank (Plane A only; auto-selected when a key is present)

ai_usage_summary: |
  Claude (including the claude CLI) was used for architecture, code authoring and review,
  documentation, the deck, and — in OFFLINE pre-compute (Plane A) — as a live LLM judge
  that re-ranked the shortlist and wrote per-candidate reasoning (299 real judgments this
  run). NVIDIA hosted endpoints (build.nvidia.com) are wired for Plane A only: nv-embedqa
  embeddings (local BAAI/bge-small as no-key fallback, TF-IDF/SVD as the deterministic
  floor) and a large instruct model for shortlist re-rank and reasoning. All LLM
  reasoning is POST-VALIDATED so every named skill, company, and number appears in the
  candidate's own profile (no hallucination). The scored ranker (rank.py, Plane B) makes
  NO network, GPU, or LLM call — proven by a no-socket test, the absence of any networked
  import on the rank path, and a docker run with --network none that produced a valid CSV
  offline. The live product (Plane C) uses AI at runtime but reads rank.py's OUTPUT and
  never invokes it online. The whole pipeline runs end-to-end with NO NVIDIA key and NO
  GCP credentials (local/TF-IDF embeddings + rule-proxy + deterministic reasoning still
  yield a valid, honeypot-clean submission). AI tools are quality multipliers, never
  dependencies on the graded path.

# ============================================================================
# Approach summary  (<=200 words)
# ============================================================================
methodology_summary: |
  A hybrid funnel split across three planes. Offline (Plane A): embed the career NARRATIVE
  (not the skills list), fit BM25/TF-IDF, build ~40 deterministic features, fuse a
  recall-first pass into a K=1200 shortlist (recall gate verified: 100% of proxy-Tier-5 and
  Tier-4 inside), re-rank the shortlist with an LLM, and freeze everything to checksummed
  artifacts. The graded ranker (Plane B, rank.py) loads those artifacts, streams the JSONL,
  fuses sub-scores into a blend, applies multiplicative ANTI-TRAP caps (non-eng title + AI
  skill => x0.15, the direct counter to the keyword-stuffer baseline), a bounded behavioral
  multiplier (sentinels never penalize), and a 3-layer honeypot gate (clean-201 structural
  exclude + live re-verify + top-10 paranoia). Salary inversion (18.9%, a dataset norm) is
  deliberately NOT flagged. Output: top-100 with fact-validated reasoning, written only after
  an in-process validator pass. Measured on the real 100K: 73.5 s, 2.01 GB, CPU-only, no
  network, byte-identical across runs, 0 honeypots in top-100/top-10. Evidence beats title;
  the top-10 are all genuine ranking/search/recsys engineers at product companies.

